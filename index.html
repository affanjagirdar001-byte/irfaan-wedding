<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Irfaan ❤️ Rupaa Wedding</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #12000d;
        }

        /* =========================
           FIRST SCREEN
        ========================= */

        #welcome {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(30, 0, 20, 0.45),
                    rgba(30, 0, 20, 0.7)
                ),
                url("wedding.png");

            background-size: cover;
            background-position: center;

            transition: 1.2s ease;
        }

        .welcome-card {
            width: min(90%, 650px);
            padding: 45px 30px;

            text-align: center;

            background: rgba(20, 0, 15, 0.72);
            backdrop-filter: blur(12px);

            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 30px;

            box-shadow:
                0 0 50px rgba(255, 0, 120, 0.5),
                inset 0 0 30px rgba(255,255,255,0.08);

            animation: cardAppear 1.5s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(.7) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .welcome-card h1 {
            color: white;
            font-size: clamp(35px, 7vw, 70px);

            text-shadow:
                0 0 10px #ff2d91,
                0 0 30px #ff2d91;

            margin-bottom: 10px;
        }

        .welcome-card h2 {
            color: #ffd2e8;
            font-size: clamp(20px, 4vw, 32px);
            margin-bottom: 12px;
        }

        .welcome-card p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 30px;
        }

        /* YES BUTTON */

        #yesButton {
            border: none;
            outline: none;

            padding: 18px 65px;

            font-size: 25px;
            font-weight: bold;

            color: white;

            border-radius: 60px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #ff176f,
                    #ff4b18
                );

            box-shadow:
                0 0 20px #ff176f,
                0 0 50px rgba(255, 23, 111, .5);

            transition: .3s;

            animation: buttonPulse 1.5s infinite;
        }

        #yesButton:hover {
            transform: scale(1.12);

            box-shadow:
                0 0 30px #ff176f,
                0 0 80px #ff176f;
        }

        @keyframes buttonPulse {
            50% {
                transform: scale(1.05);
            }
        }


        /* =========================
           WEDDING SCREEN
        ========================= */

        #weddingScene {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #080008;

            opacity: 0;
            transform: scale(1.15);

            pointer-events: none;

            transition:
                opacity 1.5s ease,
                transform 1.8s ease;
        }

        #weddingImage {
            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                brightness(.9)
                saturate(1.15);

            transform: scale(1);

            animation: imageZoom 15s ease-in-out infinite alternate;
        }

        @keyframes imageZoom {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.06);
            }
        }


        /* =========================
           PHOTO GLOW
        ========================= */

        .imageGlow {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    transparent 45%,
                    rgba(0,0,0,.35)
                );
        }


        /* =========================
           WEDDING TEXT
        ========================= */

        .topTitle {
            position: absolute;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: clamp(20px, 4vw, 42px);

            font-weight: bold;

            text-align: center;

            text-shadow:
                0 0 10px #ff1680,
                0 0 25px #ff1680;

            opacity: 0;

            transition: 2s;

            pointer-events: none;
        }


        /* =========================
           HEARTS
        ========================= */

        .heart {
            position: absolute;

            color: #ff4d91;

            font-size: 30px;

            pointer-events: none;

            animation: floatHeart linear forwards;
        }

        @keyframes floatHeart {

            0% {
                opacity: 0;
                transform:
                    translateY(100vh)
                    scale(.5)
                    rotate(0deg);
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform:
                    translateY(-20vh)
                    scale(1.4)
                    rotate(30deg);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 700px) {

            #weddingImage {
                object-fit: contain;
            }

            .welcome-card {
                padding: 35px 20px;
            }

            #yesButton {
                padding: 16px 50px;
                font-size: 21px;
            }
        }
    </style>
</head>


<body>


<!-- =================================
     FIRST PAGE
================================= -->

<section id="welcome">

    <div class="welcome-card">

        <h1>💍 Wedding Invitation 💍</h1>

        <h2>
            Irfaan ❤️ Rupaa
        </h2>

        <p>
            Gaon ki shaadi mein aapka swagat hai 🌸
        </p>

        <button id="yesButton">
            YES ❤️
        </button>

    </div>

</section>



<!-- =================================
     WEDDING PAGE
================================= -->

<section id="weddingScene">

    <img
        id="weddingImage"
        src="wedding.png"
        alt="Irfaan and Rupaa Village Wedding"
    >

    <div class="imageGlow"></div>

    <div class="topTitle">
        💍 IRFAAN ❤️ RUPAA 💍
    </div>

</section>



<script>

const yesButton =
    document.getElementById("yesButton");

const welcome =
    document.getElementById("welcome");

const weddingScene =
    document.getElementById("weddingScene");

const topTitle =
    document.querySelector(".topTitle");


/* =================================
   YES BUTTON
================================= */

yesButton.addEventListener("click", function() {

    /* Button animation */

    yesButton.innerHTML = "❤️ YES! ❤️";

    yesButton.style.transform = "scale(1.3)";


    /* Wait little */

    setTimeout(function() {

        /* Hide invitation */

        welcome.style.opacity = "0";

        welcome.style.transform =
            "scale(1.3)";


        /* Show wedding scene */

        weddingScene.style.opacity = "1";

        weddingScene.style.transform =
            "scale(1)";

        weddingScene.style.pointerEvents =
            "auto";


        /* Title */

        setTimeout(function() {

            topTitle.style.opacity = "1";

        }, 1000);


        /* Start hearts */

        startHearts();

    }, 500);

});


/* =================================
   FLOATING HEARTS
================================= */

function startHearts() {

    setInterval(function() {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            ["❤️","💖","💕","💗","💘"]
            [Math.floor(Math.random()*5)];

        heart.style.left =
            Math.random() * 100 + "%";

        heart.style.animationDuration =
            (4 + Math.random() * 4) + "s";

        heart.style.fontSize =
            (18 + Math.random() * 25) + "px";

        weddingScene.appendChild(heart);


        setTimeout(function() {

            heart.remove();

        }, 8000);

    }, 450);

}

</script>

</body>
</html>
